<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Gratis - CitaFuego.com</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">🔥 CitaFuego<span>.com</span></a>
            <div class="nav-links">
                <a href="index.html">← Volver al inicio</a>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <h1>✨ Crea tu cuenta gratis</h1>
        <p class="auth-subtitle">Únete a más de 250,000 solteros</p>

        <div id="alert-box"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="name">Tu nombre</label>
                <input type="text" id="name" required placeholder="¿Cómo te llamas?">
            </div>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" required placeholder="Repite tu contraseña">
            </div>
            <button type="submit" class="btn btn-primary btn-block">🔥 Registrarme gratis</button>
        </form>

        <div class="auth-footer">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertBox = document.getElementById('alert-box');

            if (password !== confirmPassword) {
                alertBox.innerHTML = '<div class="alert alert-error">Las contraseñas no coinciden</div>';
                return;
            }

            const result = Auth.register(name, email, password);
            
            if (result.success) {
                alertBox.innerHTML = '<div class="alert alert-success">¡Cuenta creada! Redirigiendo...</div>';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                alertBox.innerHTML = `<div class="alert alert-error">${result.message}</div>`;
            }
        });
    </script>
</body>
</html>
