name: Deploy account auth edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/account-auth-v12/**'
      - '.github/workflows/deploy-account-auth-edge.yml'

permissions:
  contents: read

concurrency:
  group: citafuego-account-auth-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: stfbybkutnoqoxhqxyou
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate Supabase credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
      - name: Deploy account-auth-v12
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy account-auth-v12 --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
