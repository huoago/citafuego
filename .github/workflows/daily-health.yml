name: Daily production health and self-heal

on:
  schedule:
    - cron: '0 13 * * *' # 08:00 America/Lima (UTC-5)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-health.yml'
      - 'scripts/production-seo-audit.mjs'

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: citafuego-daily-health
  cancel-in-progress: false

jobs:
  health-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Initial production inspection
        id: initial
        shell: bash
        run: |
          set +e
          failed=0
          report=''

          apex_a=$(dig +short citafuego.com A | tr '\n' ' ')
          www_cname=$(dig +short www.citafuego.com CNAME | tr '\n' ' ')
          if [ -z "$apex_a" ]; then failed=1; report+="- DNS: citafuego.com has no A record\\n"; fi
          if [[ "$www_cname" != *"vercel-dns"* ]]; then failed=1; report+="- DNS: unexpected www CNAME: ${www_cname:-<empty>}\\n"; fi

          for host in citafuego.com www.citafuego.com; do
            if ! echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -checkend 604800 >/dev/null 2>&1; then
              failed=1
              report+="- TLS: ${host} certificate unavailable or expires within 7 days\\n"
            fi
            body=$(mktemp)
            code=$(curl -sS -L --max-time 25 -o "$body" -w '%{http_code}' "https://${host}/api/health" || true)
            if [ "$code" != 200 ] || ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body" || ! grep -Eq '"service"[[:space:]]*:[[:space:]]*"citafuego"' "$body"; then
              failed=1
              report+="- Health: ${host}/api/health failed identity/HTTP check (${code:-000})\\n"
            fi
            rm -f "$body"
          done

          ready_body=$(mktemp)
          ready_code=$(curl -sS -L --max-time 30 -o "$ready_body" -w '%{http_code}' https://citafuego.com/api/ready || true)
          if [ "$ready_code" != 200 ] || ! grep -Eq '"ready"[[:space:]]*:[[:space:]]*true' "$ready_body"; then
            failed=1
            report+="- Readiness: citafuego.com/api/ready failed (${ready_code:-000})\\n"
          fi
          rm -f "$ready_body"

          for path in / /iniciar-sesion /registro /terminos /privacidad /safety /community-guidelines /help /robots.txt /sitemap.xml /lima /guias; do
            code=$(curl -sS -L --max-time 25 -o /dev/null -w '%{http_code}' "https://citafuego.com${path}" || true)
            if [[ "$code" != 2* && "$code" != 3* ]]; then
              failed=1
              report+="- HTTP: https://citafuego.com${path} returned ${code:-000}\\n"
            fi
          done

          if ! SEO_AUDIT_BASE_URL=https://citafuego.com node scripts/production-seo-audit.mjs >/tmp/seo-audit.log 2>&1; then
            failed=1
            report+="- SEO/privacy production audit failed\\n"
            cat /tmp/seo-audit.log
          fi

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<EOF'
            printf '%b' "$report"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          printf '%b' "$report"

      - name: Repair Vercel domain, AliDNS and HTTPS
        if: steps.initial.outputs.failed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh workflow run bind-production-domain.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 5
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bind-production-domain.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -z "$run_id" ] || gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Check whether infrastructure repair recovered service
        id: infra
        if: steps.initial.outputs.failed == '1'
        shell: bash
        run: |
          set +e
          sleep 10
          failed=0
          for host in citafuego.com www.citafuego.com; do
            body=$(mktemp)
            code=$(curl -sS -L --max-time 25 -o "$body" -w '%{http_code}' "https://${host}/api/health" || true)
            if [ "$code" != 200 ] || ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body" || ! grep -Eq '"service"[[:space:]]*:[[:space:]]*"citafuego"' "$body"; then failed=1; fi
            rm -f "$body"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Clean tested redeploy when infrastructure repair is insufficient
        if: steps.infra.outputs.failed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh workflow run production-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          sleep 5
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow production-deploy.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -z "$run_id" ] || gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Final production inspection
        id: final
        if: steps.initial.outputs.failed == '1'
        shell: bash
        run: |
          set +e
          sleep 10
          failed=0
          report=''
          for host in citafuego.com www.citafuego.com; do
            body=$(mktemp)
            code=$(curl -sS -L --max-time 25 -o "$body" -w '%{http_code}' "https://${host}/api/health" || true)
            if [ "$code" != 200 ] || ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body" || ! grep -Eq '"service"[[:space:]]*:[[:space:]]*"citafuego"' "$body"; then
              failed=1
              report+="- ${host} remains unhealthy (${code:-000})\\n"
            fi
            rm -f "$body"
          done
          if ! curl -fsS --max-time 30 https://citafuego.com/api/ready | grep -Eq '"ready"[[:space:]]*:[[:space:]]*true'; then
            failed=1
            report+="- Production readiness remains unhealthy\\n"
          fi
          if ! SEO_AUDIT_BASE_URL=https://citafuego.com node scripts/production-seo-audit.mjs >/tmp/final-seo-audit.log 2>&1; then
            failed=1
            report+="- SEO/privacy production audit remains unhealthy\\n"
            cat /tmp/final-seo-audit.log
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<EOF'
            printf '%b' "$report"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          printf '%b' "$report"

      - name: Close stale health incidents after recovery
        if: steps.initial.outputs.failed == '0' || steps.final.outputs.failed == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const issue of issues.filter(i => i.title.startsWith('[Health] CitaFuego production unrecovered') || i.title.startsWith('[Health] Production endpoint failure'))) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: 'Automated health check confirms CitaFuego production is healthy again, including readiness and SEO/privacy gates. Closing this incident.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }

      - name: Open incident when automatic repair cannot recover production
        if: steps.final.outputs.failed == '1'
        uses: actions/github-script@v7
        env:
          INITIAL_REPORT: ${{ steps.initial.outputs.report }}
          FINAL_REPORT: ${{ steps.final.outputs.report }}
        with:
          script: |
            const date = new Date().toISOString().slice(0,10);
            const title = `[Health] CitaFuego production unrecovered ${date}`;
            const body = `Daily self-healing detected a production failure and automatic repair did not fully recover it.\n\n### Initial\n${process.env.INITIAL_REPORT || '- No detail'}\n\n### Final\n${process.env.FINAL_REPORT || '- No detail'}\n\nAttempted: domain/Vercel repair, Alibaba Cloud DNS repair, HTTPS re-verification, clean tested production redeploy, readiness verification, and SEO/privacy audit.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const existing = issues.find(i => i.title === title);
            if (existing) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });

      - name: Fail only when production remains unhealthy
        if: steps.final.outputs.failed == '1'
        run: exit 1
