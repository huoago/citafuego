name: CitaFuego CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/citafuego-v1]

permissions:
  contents: read
  statuses: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Secret scan
        run: node scripts/check-no-secrets.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and security contracts
        run: npm test
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://citafuego.com
          NEXT_PUBLIC_SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: Publish quality-gate commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          target_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          payload=$(STATE="$state" node -e 'process.stdout.write(JSON.stringify({state:process.env.STATE,context:"citafuego/quality-gate",description:`CitaFuego CI ${process.env.STATE}`}))')
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            -d "$payload"
