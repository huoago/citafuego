name: CitaFuego CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/citafuego-v1]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Secret scan
        run: node scripts/check-no-secrets.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and security contracts
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: test-output.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://citafuego.com
          NEXT_PUBLIC_SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
