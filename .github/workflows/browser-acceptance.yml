name: Playwright Browser Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install application
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: Install Playwright runner
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium
      - name: Start app
        shell: bash
        run: |
          npm run start >/tmp/citafuego-browser.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/citafuego-browser.log
          exit 1
      - name: Desktop and mobile acceptance
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: node e2e/browser-smoke.mjs
      - name: Stabilize temporary production QA harness
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='e2e/production-admin-full-qa.mjs';
          let source=fs.readFileSync(path,'utf8');
          const from="  await page.getByRole('button',{name:'Continuar sin fotos'}).click();";
          const to="  const skipPhotos=page.getByRole('button',{name:'Continuar sin fotos'});\n  await skipPhotos.waitFor({state:'visible',timeout:15000});\n  await skipPhotos.evaluate(el=>el.click());";
          if(!source.includes(from)) throw new Error('optional photo skip target not found');
          source=source.replace(from,to);
          fs.writeFileSync(path,source);
          NODE
      - name: Temporary production full-site admin QA
        run: node e2e/production-admin-full-qa.mjs
      - name: Upload temporary production QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-admin-full-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: warn
