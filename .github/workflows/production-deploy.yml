name: Production deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citafuego-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-no-secrets.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Next.js production build gate
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://citafuego.com
          NEXT_PUBLIC_SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Stop when Vercel production credentials are unavailable
        if: ${{ env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '' }}
        run: |
          echo 'Build passed, but Production READY is not established: Vercel production credentials are not configured.'
          exit 1
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt production artifact
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Verify production health
        run: |
          code=$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' https://citafuego.com/api/health)
          test "$code" = "200"
