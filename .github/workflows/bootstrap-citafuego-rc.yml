name: Verify CitaFuego RC

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-citafuego-rc.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/citafuego-v1
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Secret scan
        run: node scripts/check-no-secrets.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and security contract tests
        run: npm test

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://citafuego.com
          NEXT_PUBLIC_SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
