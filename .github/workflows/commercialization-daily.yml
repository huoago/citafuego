name: Commercialization daily maintenance

on:
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercialization-daily
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    env:
      COMMERCIAL_CRON_SECRET: ${{ secrets.COMMERCIAL_CRON_SECRET }}
    steps:
      - name: Run daily creator economics maintenance
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COMMERCIAL_CRON_SECRET:-}" ]; then
            echo "COMMERCIAL_CRON_SECRET is not configured; maintenance is safely skipped."
            exit 0
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${COMMERCIAL_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            https://citafuego.com/api/cron/commercialization
