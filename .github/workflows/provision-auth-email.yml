name: Provision auth email infrastructure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-auth-email.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_Ga9U5PGbdPU9nUBdWJh8wIV3
      VERCEL_PROJECT_ID: prj_QJxwaFzzxgPX2ZWy26gkA3WLWJKj
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'Missing VERCEL_TOKEN'; exit 1; }

      - name: Probe Marketplace REST authorization
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.vercel.com/v1/integrations/configurations?view=account&installationType=marketplace&integrationIdOrSlug=resend&teamId=${VERCEL_ORG_ID}"
          code=$(curl -sS -o /tmp/vercel-marketplace.json -w '%{http_code}' \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            "$url")
          echo "http_status=$code" >> "$GITHUB_OUTPUT"
          HTTP_STATUS="$code" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const status=process.env.HTTP_STATUS;
          let body={};
          try { body=JSON.parse(fs.readFileSync('/tmp/vercel-marketplace.json','utf8')); } catch {}
          const list=Array.isArray(body)?body:(Array.isArray(body.configurations)?body.configurations:[]);
          const safe=list.map((item)=>({id:item.id,slug:item.slug,status:item.status,installationType:item.installationType,teamId:item.teamId,projects:item.projects}));
          fs.writeFileSync('/tmp/vercel-marketplace-safe.json',JSON.stringify({httpStatus:Number(status),configurations:safe,error:body?.error?.message||body?.message||null},null,2));
          console.log(fs.readFileSync('/tmp/vercel-marketplace-safe.json','utf8'));
          if(status!=='200') process.exit(1);
          if(!safe.some((item)=>String(item.slug||'').toLowerCase().includes('resend'))) process.exit(2);
          NODE

      - name: Record Marketplace authorization result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status='${{ steps.probe.outputs.http_status }}'
          result='${{ steps.probe.outcome }}'
          details='No response body was produced.'
          if [ -f /tmp/vercel-marketplace-safe.json ]; then
            details=$(cat /tmp/vercel-marketplace-safe.json)
          fi
          body=$(cat <<EOF
          ## Vercel Marketplace authorization probe

          - commit: ${GITHUB_SHA}
          - REST HTTP status: ${status:-unknown}
          - probe outcome: ${result}
          - target integration: Resend
          - target team: ${VERCEL_ORG_ID}

          Sanitized result:
          \`\`\`json
          ${details}
          \`\`\`

          This probe contains no Vercel token or provider secret.
          EOF
          )
          gh issue comment 29 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Enforce probe result
        if: steps.probe.outcome != 'success'
        shell: bash
        run: |
          echo 'Marketplace REST authorization is not sufficient to provision Resend automatically.'
          exit 1
