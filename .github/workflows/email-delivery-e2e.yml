name: One-time production auth email delivery E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/email-delivery-e2e.yml'

permissions:
  contents: read
  issues: write

jobs:
  email-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_bzwmFw6D6rx0X4D5VWonhA_hkxf9c4d
      E2E_EMAIL: huoago@gmail.com
    steps:
      - name: Request real passwordless email
        id: request
        shell: bash
        run: |
          set -euo pipefail
          http_status=$(curl -sS -o /tmp/auth-email-response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/auth/v1/otp" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$E2E_EMAIL\",\"create_user\":true}")
          echo "http_status=$http_status" >> "$GITHUB_OUTPUT"
          HTTP_STATUS="$http_status" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let body={};
          try { body=JSON.parse(fs.readFileSync('/tmp/auth-email-response.json','utf8')); } catch {}
          const safe={
            httpStatus:Number(process.env.HTTP_STATUS),
            errorCode:body.error_code||body.code||null,
            message:body.msg||body.message||null,
          };
          fs.writeFileSync('/tmp/auth-email-safe.json',JSON.stringify(safe,null,2));
          console.log(JSON.stringify(safe,null,2));
          NODE

      - name: Record sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=$(cat /tmp/auth-email-safe.json 2>/dev/null || printf '{"httpStatus":0,"message":"no result"}')
          body=$(cat <<EOF
          ## One-time production Auth email E2E request

          - commit: ${GITHUB_SHA}
          - recipient: ${E2E_EMAIL}
          - purpose: verify real Supabase Auth email delivery to the connected project-owner mailbox
          - no password, OTP, magic-link token or session is logged

          \`\`\`json
          ${result}
          \`\`\`
          EOF
          )
          gh issue comment 29 --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Enforce successful Auth request
        shell: bash
        run: |
          test '${{ steps.request.outputs.http_status }}' = '200'
