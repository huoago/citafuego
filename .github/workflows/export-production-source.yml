name: Export production source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/citafuego-source.tgz .
          sha256sum /tmp/citafuego-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: citafuego-production-source
          path: /tmp/citafuego-source.tgz
          retention-days: 1
          if-no-files-found: error
