name: Export production source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf /tmp/citafuego-source.tgz .
          sha256sum /tmp/citafuego-source.tgz | tee /tmp/source.sha
      - uses: actions/upload-artifact@v4
        with:
          name: citafuego-production-source
          path: /tmp/citafuego-source.tgz
          retention-days: 1
          if-no-files-found: error
      - name: Upload archive to temporary private Supabase relay
        env:
          SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_bzwmFw6D6rx0X4D5VWonhA_hkxf9c4d
          SUPABASE_ANON_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0ZmJ5Ymt1dG5vcW94aHF4eW91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NDY1OTcsImV4cCI6MjEwMjMyMjU5N30.YJokmEE5aIpBMvkbiX6aUcxVoU8kKSad7QzFoSGCw74
          RELAY_OBJECT: UxE1nf33txQiqTM5W29WVbV3N0uJ4Fug.tgz
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/storage/v1/object/deploy-source-temp/$RELAY_OBJECT" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_JWT" \
            -H "Content-Type: application/gzip" \
            -H "x-upsert: true" \
            --data-binary @/tmp/citafuego-source.tgz
          echo
          curl --fail-with-body --silent --show-error \
            "$SUPABASE_URL/storage/v1/object/authenticated/deploy-source-temp/$RELAY_OBJECT" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_JWT" \
            -o /tmp/relay-check.tgz
          test "$(sha256sum /tmp/citafuego-source.tgz | cut -d' ' -f1)" = "$(sha256sum /tmp/relay-check.tgz | cut -d' ' -f1)"
          echo "Private relay upload verified byte-for-byte."
