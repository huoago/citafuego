name: Ephemeral Production Authenticated QA

on:
  push:
    branches: [qa/full-production-browser-20260904]

permissions:
  contents: read

concurrency:
  group: citafuego-production-synthetic-qa
  cancel-in-progress: true

jobs:
  authenticated-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Chromium QA runner
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium
      - name: Run authenticated production journeys
        run: node e2e/run-ephemeral-production-authenticated-qa.mjs
