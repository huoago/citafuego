name: Inspect auth secret presence

on:
  push:
    branches: [ops/inspect-auth-secret-presence]

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_ADMIN_EMAIL: ${{ secrets.SMTP_ADMIN_EMAIL }}
    steps:
      - name: Record presence only
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/presence.txt
          for name in SUPABASE_ACCESS_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET RESEND_API_KEY SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS SMTP_ADMIN_EMAIL; do
            if [ -n "${!name:-}" ]; then
              printf '%s=present\n' "$name" >> /tmp/presence.txt
            else
              printf '%s=missing\n' "$name" >> /tmp/presence.txt
            fi
          done
          cat /tmp/presence.txt
          body=$(cat <<EOF
          ## Production Auth secret presence probe

          - commit: ${GITHUB_SHA}
          - values: **never read or printed**; only presence is reported

          \`\`\`text
          $(cat /tmp/presence.txt)
          \`\`\`
          EOF
          )
          gh issue comment 29 --repo "$GITHUB_REPOSITORY" --body "$body"
