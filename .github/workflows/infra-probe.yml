name: Production infrastructure probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS state
        shell: bash
        run: |
          echo '=== citafuego.com A ==='
          dig +short citafuego.com A || true
          echo '=== citafuego.com NS ==='
          dig +short citafuego.com NS || true
          echo '=== www.citafuego.com CNAME ==='
          dig +short www.citafuego.com CNAME || true
          echo '=== www.citafuego.com A ==='
          dig +short www.citafuego.com A || true
      - name: HTTP health probes
        shell: bash
        run: |
          probe() {
            local url="$1"
            echo "=== $url ==="
            curl --silent --show-error --location --max-time 30 \
              --output /tmp/probe-body \
              --write-out 'HTTP=%{http_code} FINAL=%{url_effective}\n' \
              "$url" || true
            head -c 500 /tmp/probe-body 2>/dev/null || true
            echo
          }
          probe 'https://citafuego-prod-2sqlhwb3p-huoago-7712s-projects.vercel.app/api/health'
          probe 'https://citafuego-prod-huoago-7712s-projects.vercel.app/api/health'
          probe 'https://citafuego.com/api/health'
          probe 'https://www.citafuego.com/api/health'
