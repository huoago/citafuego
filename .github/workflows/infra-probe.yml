name: Production infrastructure probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production DNS, TLS and HTTPS
        shell: bash
        run: |
          set -uo pipefail
          exec > >(tee /tmp/infra-probe.txt) 2>&1
          failed=0

          echo '=== DNS ==='
          apex_a=$(dig +short citafuego.com A | awk '/^[0-9.]+$/{print}' | tr '\n' ' ')
          apex_ns=$(dig +short citafuego.com NS | tr '\n' ' ')
          www_cname=$(dig +short www.citafuego.com CNAME | tr '\n' ' ')
          echo "citafuego.com A: ${apex_a:-<none>}"
          echo "citafuego.com NS: ${apex_ns:-<none>}"
          echo "www.citafuego.com CNAME: ${www_cname:-<none>}"

          if [ -z "$apex_a" ]; then
            echo 'ERROR: citafuego.com has no public IPv4 record.'
            failed=1
          fi
          if [[ "$apex_ns" != *"alidns.com"* ]]; then
            echo 'ERROR: citafuego.com authoritative nameservers are not AliDNS.'
            failed=1
          fi
          if [[ "$www_cname" != *"vercel-dns"* ]]; then
            echo 'ERROR: www.citafuego.com does not point to Vercel DNS.'
            failed=1
          fi

          for host in citafuego.com www.citafuego.com; do
            echo "=== TLS ${host} ==="
            if ! echo | openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -checkend 604800; then
              echo "ERROR: ${host} TLS certificate is unavailable or expires within 7 days."
              failed=1
            fi

            echo "=== HTTPS health ${host} ==="
            body_file=$(mktemp)
            result=$(curl --silent --show-error --location --max-time 30 \
              --output "$body_file" \
              --write-out '%{http_code} %{url_effective}' \
              "https://${host}/api/health" || true)
            code=${result%% *}
            final_url=${result#* }
            echo "HTTP=${code:-000} FINAL=${final_url:-<none>}"
            head -c 500 "$body_file" 2>/dev/null || true
            echo
            if [ "$code" != "200" ] || \
              ! grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$body_file" || \
              ! grep -Eq '"service"[[:space:]]*:[[:space:]]*"citafuego"' "$body_file"; then
              echo "ERROR: ${host} health endpoint failed HTTP or CitaFuego identity validation."
              failed=1
            fi
            if [ "$host" = "www.citafuego.com" ] && [[ "$final_url" != https://citafuego.com/* ]]; then
              echo 'ERROR: www traffic did not canonicalize to the apex domain.'
              failed=1
            fi
            rm -f "$body_file"
          done

          echo '=== Application readiness ==='
          ready_file=$(mktemp)
          ready_code=$(curl --silent --show-error --location --max-time 30 \
            --output "$ready_file" --write-out '%{http_code}' \
            https://citafuego.com/api/ready || true)
          echo "HTTP=${ready_code:-000}"
          head -c 500 "$ready_file" 2>/dev/null || true
          echo
          if [ "$ready_code" != "200" ] || ! grep -Eq '"ready"[[:space:]]*:[[:space:]]*true' "$ready_file"; then
            echo 'ERROR: production readiness endpoint is not ready.'
            failed=1
          fi
          rm -f "$ready_file"

          if [ "$failed" -ne 0 ]; then
            echo 'Production infrastructure probe failed.'
            exit 1
          fi
          echo 'Production infrastructure probe passed.'

      - name: Upload infrastructure probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: citafuego-infra-probe
          path: /tmp/infra-probe.txt
          retention-days: 1
          if-no-files-found: error
