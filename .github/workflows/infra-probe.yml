name: Production infrastructure probe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DNS and HTTPS
        shell: bash
        run: |
          set +e
          exec > >(tee /tmp/infra-probe.txt) 2>&1
          echo '=== citafuego.com A ==='
          dig +short citafuego.com A
          echo '=== citafuego.com NS ==='
          dig +short citafuego.com NS
          echo '=== www.citafuego.com CNAME ==='
          dig +short www.citafuego.com CNAME
          echo '=== www.citafuego.com A ==='
          dig +short www.citafuego.com A
          probe() {
            local url="$1"
            echo "=== $url ==="
            rm -f /tmp/probe-body
            curl --silent --show-error --location --max-time 30 \
              --output /tmp/probe-body \
              --write-out 'HTTP=%{http_code} FINAL=%{url_effective}\n' \
              "$url"
            head -c 500 /tmp/probe-body 2>/dev/null || true
            echo
          }
          resolved_https_probe() {
            local host="$1"
            echo "=== DNS-SIMULATED https://$host/api/health via 76.76.21.21 ==="
            rm -f /tmp/probe-body
            curl --silent --show-error --location --max-time 30 \
              --resolve "$host:443:76.76.21.21" \
              --output /tmp/probe-body \
              --write-out 'HTTP=%{http_code} FINAL=%{url_effective} TLS=%{ssl_verify_result}\n' \
              "https://$host/api/health"
            head -c 500 /tmp/probe-body 2>/dev/null || true
            echo
          }
          resolved_http_probe() {
            local host="$1"
            echo "=== HOST-SIMULATED http://$host/api/health via 76.76.21.21 ==="
            rm -f /tmp/probe-body /tmp/probe-headers
            curl --silent --show-error --max-time 30 \
              --resolve "$host:80:76.76.21.21" \
              --dump-header /tmp/probe-headers \
              --output /tmp/probe-body \
              --write-out 'HTTP=%{http_code} REDIRECT=%{redirect_url}\n' \
              "http://$host/api/health"
            cat /tmp/probe-headers 2>/dev/null || true
            head -c 500 /tmp/probe-body 2>/dev/null || true
            echo
          }
          probe 'https://citafuego-prod-2sqlhwb3p-huoago-7712s-projects.vercel.app/api/health'
          probe 'https://citafuego-prod-huoago-7712s-projects.vercel.app/api/health'
          probe 'https://citafuego.com/api/health'
          probe 'https://www.citafuego.com/api/health'
          resolved_https_probe 'citafuego.com'
          resolved_https_probe 'www.citafuego.com'
          resolved_http_probe 'citafuego.com'
          resolved_http_probe 'www.citafuego.com'
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: citafuego-infra-probe
          path: /tmp/infra-probe.txt
          retention-days: 1
          if-no-files-found: error
