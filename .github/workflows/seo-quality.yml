name: SEO and Web Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/citafuego-next.log 2>&1 &
          echo $! > /tmp/citafuego-next.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/citafuego-next.log
          exit 1
      - name: SEO and privacy contracts against built app
        env:
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/production-seo-audit.mjs
      - name: Lighthouse audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo 'Chrome/Chromium not found on runner' >&2
            exit 1
          fi
          export CHROME_PATH
          echo "Using Chrome at $CHROME_PATH"
          # GitHub-hosted runners have variable CPU contention. Capture three
          # independent samples per page and gate on the median rather than one
          # noisy trace. Thresholds remain unchanged in the next step.
          for target in home lima guide; do
            case "$target" in
              home) url='http://127.0.0.1:3000/' ;;
              lima) url='http://127.0.0.1:3000/lima' ;;
              guide) url='http://127.0.0.1:3000/guias/seguridad-en-citas-online' ;;
            esac
            for sample in 1 2 3; do
              output="lighthouse/${target}-${sample}.json"
              rm -f "$output"
              success=0
              for attempt in 1 2; do
                if npx --yes lighthouse@latest "$url" --quiet \
                  --chrome-path="$CHROME_PATH" \
                  --chrome-flags='--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu' \
                  --output=json --output-path="$output"; then
                  success=1
                  break
                fi
                echo "Lighthouse ${target} sample ${sample} attempt ${attempt} failed; retrying..." >&2
                sleep 2
              done
              if [ "$success" -ne 1 ] || [ ! -s "$output" ]; then
                echo "Lighthouse failed for ${target} sample ${sample}" >&2
                exit 1
              fi
              sleep 1
            done
          done
      - name: Enforce Lighthouse thresholds
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const thresholds={performance:0.80,accessibility:0.90,'best-practices':0.90,seo:0.95};
          const targets=['home','lima','guide'];
          const median=(values)=>{
            const sorted=[...values].sort((a,b)=>a-b);
            return sorted[Math.floor(sorted.length/2)];
          };
          for(const target of targets){
            const reports=[1,2,3].map((sample)=>JSON.parse(fs.readFileSync(`lighthouse/${target}-${sample}.json`,'utf8')));
            for(const [category,min] of Object.entries(thresholds)){
              const samples=reports.map((report)=>report.categories?.[category]?.score ?? 0);
              const score=median(samples);
              console.log(`${target} ${category}: samples=${samples.join(',')} median=${score}`);
              if(score<min)throw new Error(`${target} ${category} median ${score} is below ${min}`);
            }
          }
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ github.run_id }}
          path: lighthouse/
          if-no-files-found: ignore
          retention-days: 7
