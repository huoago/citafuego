name: SEO and Web Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SUPABASE_URL: https://stfbybkutnoqoxhqxyou.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: Start production server
        shell: bash
        run: |
          npm run start > /tmp/citafuego-next.log 2>&1 &
          echo $! > /tmp/citafuego-next.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/citafuego-next.log
          exit 1
      - name: SEO and privacy contracts against built app
        env:
          SEO_AUDIT_BASE_URL: http://127.0.0.1:3000
        run: node scripts/production-seo-audit.mjs
      - name: Lighthouse audits
        shell: bash
        run: |
          mkdir -p lighthouse
          for target in home lima guide; do
            case "$target" in
              home) url='http://127.0.0.1:3000/' ;;
              lima) url='http://127.0.0.1:3000/lima' ;;
              guide) url='http://127.0.0.1:3000/guias/seguridad-en-citas-online' ;;
            esac
            npx --yes lighthouse@latest "$url" --quiet --chrome-flags='--headless --no-sandbox' --output=json --output-path="lighthouse/${target}.json"
          done
      - name: Enforce Lighthouse thresholds
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const thresholds={performance:0.80,accessibility:0.90,'best-practices':0.90,seo:0.95};
          for(const file of fs.readdirSync('lighthouse').filter((name)=>name.endsWith('.json'))){
            const report=JSON.parse(fs.readFileSync(`lighthouse/${file}`,'utf8'));
            for(const [category,min] of Object.entries(thresholds)){
              const score=report.categories?.[category]?.score ?? 0;
              console.log(`${file} ${category}: ${score}`);
              if(score<min)throw new Error(`${file} ${category} ${score} is below ${min}`);
            }
          }
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: lighthouse/
          if-no-files-found: ignore
          retention-days: 7
