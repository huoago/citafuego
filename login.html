<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CitaFuego.com</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="index.html" class="logo">🔥 CitaFuego<span>.com</span></a>
            <div class="nav-links">
                <a href="index.html">← Volver al inicio</a>
            </div>
        </nav>
    </header>

    <div class="auth-container">
        <h1>👋 Bienvenido de nuevo</h1>
        <p class="auth-subtitle">Inicia sesión para continuar</p>

        <div id="alert-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">🚀 Iniciar sesión</button>
        </form>

        <div class="auth-footer">
            ¿No tienes cuenta? <a href="register.html">Regístrate gratis</a>
        </div>

        <div style="margin-top: 30px; padding: 16px; background: #f8f9fa; border-radius: 8px; font-size: 13px; color: #6c757d;">
            <strong>Demo Admin:</strong> admin@citafuego.com / admin123
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            const result = Auth.login(email, password);
            
            if (result.success) {
                alertBox.innerHTML = '<div class="alert alert-success">¡Sesión iniciada correctamente! Redirigiendo...</div>';
                setTimeout(() => {
                    if (result.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 1000);
            } else {
                alertBox.innerHTML = `<div class="alert alert-error">${result.message}</div>`;
            }
        });
    </script>
</body>
</html>
